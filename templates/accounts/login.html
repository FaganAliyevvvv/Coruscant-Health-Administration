{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="cha-card">
      <h4 class="mb-3">Log In</h4>
      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="mb-3">
          <label class="form-label">Username</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          {{ form.password }}
        </div>
        <button class="btn btn-cha-primary w-100" type="submit">Log In</button>
      </form>
      <p class="mt-3 mb-0 text-muted">No account? <a href="{% url 'accounts:register_choice' %}">Register here</a>.</p>
    </div>
  </div>
</div>
{% endblock %}
